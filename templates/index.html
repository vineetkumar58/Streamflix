<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamFlix</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            STREAMFLIX
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/movies">Movies</a>
            <a href="/login">Login</a>
        </div>

    </nav>


    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">
                    STREAMFLIX ORIGINAL
                </p>

                <h1>
                    Unlimited movies.
                    <br>
                    Endless stories.
                </h1>

                <p class="hero-description">
                    Watch movies and shows anytime.
                    Your entertainment, wherever you are.
                </p>

                <div class="hero-buttons">

                    <button class="play-button">
                        ? Play
                    </button>

                    <button class="info-button">
                        ? More Info
                    </button>

                </div>

            </div>

        </section>


        <section class="movie-section">

            <h2>Popular Movies</h2>

            <div class="movie-grid">

                <div class="movie-card">
                    <div class="poster">MOVIE 1</div>
                    <h3>The Beginning</h3>
                </div>

                <div class="movie-card">
                    <div class="poster">MOVIE 2</div>
                    <h3>Dark Horizon</h3>
                </div>

                <div class="movie-card">
                    <div class="poster">MOVIE 3</div>
                    <h3>Last Mission</h3>
                </div>

                <div class="movie-card">
                    <div class="poster">MOVIE 4</div>
                    <h3>Beyond Earth</h3>
                </div>

            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
